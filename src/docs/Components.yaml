components:
  schemas:
    User:
      type: object
      properties:
        _id:
          type: string
          description: Id autogenerado de MongoDB
        first_name:
          type: string
          description: Nombre del usuario
        last_name:
          type: string
          description: Apellido del usuario
        email:
          type: string
          description: Correo electrónico
        password:
          type: string
          description: Contraseña encriptada
        role:
          type: string
          description: Rol del usuario (user o admin)
        pets:
          type: array
          description: Array de mascotas adoptadas por el usuario
          items:
            type: object
      example:
        _id: "6893eaba2ac0b16fa177be78"
        first_name: Rosa
        last_name: Yami Suárez
        email: Rosa.YamiSuarez38@gmail.com
        password: "$2b$10$hashedpassword"
        role: user
        pets: []
    UpdateUser:
      type: object
      properties:
        first_name:
          type: string
          description: Nombre del usuario
        last_name:
          type: string
          description: Apellido del usuario
        email:
          type: string
          description: Correo del usuario
        role:
          type: string
          description: Rol del usuario
      example:
        first_name: Rosa
        last_name: Suárez
        email: rosa.suarez@gmail.com
        role: admin
    Error:
      type: object
      properties:
        status:
          type: string
          example: error
        error:
          type: string
          example: User not found
